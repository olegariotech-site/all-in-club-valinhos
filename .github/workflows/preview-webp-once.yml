name: One-time WebP optimize (preview-v1)
on:
  push:
    branches: [preview-v1]
    paths:
      - ".github/workflows/preview-webp-once.yml"
permissions:
  contents: write
jobs:
  optimize:
    if: github.ref == 'refs/heads/preview-v1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview
        uses: actions/checkout@v4
        with:
          ref: preview-v1
          persist-credentials: true
      - name: Install Pillow
        run: python3 -m pip install --user Pillow==11.3.0
      - name: Generate WebP and use responsive sources
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          base = Path("assets")
          names = sorted(p for p in base.glob("*.png") if p.name.startswith(("allin-burger-premium-","allin-hotdog-premium-","allin-prensadinho-premium-")))
          assert len(names) == 10, f"Esperados 10 produtos; encontrei {len(names)}"
          original_bytes = sum(p.stat().st_size for p in names)
          desktop_bytes = mobile_bytes = 0

          for original in names:
              with Image.open(original) as img:
                  rgb = img.convert("RGB")
                  for side, quality, suffix in [(960,85,".webp"),(640,82,"-640.webp")]:
                      resized = rgb.copy()
                      resized.thumbnail((side,side), Image.Resampling.LANCZOS)
                      output = original.with_name(original.stem + suffix)
                      resized.save(output, format="WEBP", quality=quality, method=6)
                      if side==960: desktop_bytes += output.stat().st_size
                      else: mobile_bytes += output.stat().st_size

          index=Path("index.html")
          html=index.read_text(encoding="utf-8")
          expression=r'(<img\b[^>]*?)src="assets/(?P<stem>allin-(?:burger|hotdog|prensadinho)-premium-[^"]+)\.png"(?P<rest>[^>]*>)'
          def webp_source(match):
              stem=match.group("stem")
              head=match.group(1)
              tail=match.group("rest")
              if "srcset=" in tail: return match.group(0)
              sizes="(max-width: 960px) 100vw, 48vw" if "experience-image" in head else "(max-width: 520px) 100vw, (max-width: 960px) 50vw, 48vw"
              return f'{head}src="assets/{stem}.webp" srcset="assets/{stem}-640.webp 640w, assets/{stem}.webp 960w" sizes="{sizes}"{tail}'
          html, count=re.subn(expression,webp_source,html)
          assert count==17, f"Esperadas 17 imagens (5 cenas, 12 cards); encontradas {count}"
          index.write_text(html,encoding="utf-8")

          readme=Path("README.md")
          notes="\n## WebP otimizado em 14/10/2026\n\n20 variantes WebP (10 produtos x 960/640 px), com arquivos PNG originais preservados. HTML utiliza srcset e sizes; hero vídeo, logo e demais assets mantidos intactos. Conversão executada na branch preview-v1 com Pillow, qualidade 85/82. O carregamento deve ser revalidado em navegador real. Imagens conceituais dependem de aprovação do proprietário.\n"
          content=readme.read_text(encoding="utf-8")
          if "## WebP otimizado em 14/10/2026" not in content:
              readme.write_text(content+notes,encoding="utf-8")
          print(f"OT_WEBP original={original_bytes} desktop={desktop_bytes} mobile={mobile_bytes} html_images={count}")
          PY
      - name: Commit files only to preview-v1
        shell: bash
        run: |
          git config user.name "Olegario Tech (GitHub Actions)"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md assets/*.webp
          if git diff --cached --quiet; then echo "No WebP changes"; exit 0; fi
          git commit -m "perf(preview): optimize 10 food photos to responsive WebP"
          git push origin HEAD:preview-v1
